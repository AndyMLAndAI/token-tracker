<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <pattern id="barHatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-width="4" />
      <line x1="4" y1="0" x2="4" y2="8" stroke="#f1f5f9" stroke-width="4" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Dark Background Squircle -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a" />

  <!-- Bar 1: Dark Slate Gray (Left, Shortest) -->
  <rect x="128" y="270" width="76" height="132" rx="20" fill="#383b44" />

  <!-- Bar 2: Mid Gray (Middle) -->
  <rect x="218" y="196" width="76" height="206" rx="20" fill="#8e929d" />

  <!-- Bar 3: White with Hatched Diagonal Texture (Right, Tallest) -->
  <rect x="308" y="122" width="76" height="280" rx="20" fill="#ffffff" />
  <rect x="308" y="122" width="76" height="280" rx="20" fill="url(#barHatch)" />
</svg>
